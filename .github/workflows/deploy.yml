name: Deploy Dashboards Databricks

on:
  pull_request:
    paths:
      - 'src/**/*.lvdash.json'
      - 'databricks.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**/*.lvdash.json'
      - 'databricks.yml'

# ─── Autenticação ─────────────────────────────────────────────────────────────
# Configure no GitHub → Settings → Secrets and Variables → Actions:
#
#   DATABRICKS_HOST  → https://dbc-1e4a8057-b00e.cloud.databricks.com
#   DATABRICKS_TOKEN → PAT gerado em Databricks → User Settings → Access Tokens
#
# Para o teste, ambos os jobs usam o mesmo workspace.
# Em produção real, use GitHub Environments com secrets separados por ambiente.

jobs:
  # ─── Valida JSON e bundle config ─────────────────────────────────────────────
  validate:
    name: Validate Dashboard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version

      - name: Validate JSON
        run: |
          FILE="src/samples_nyctaxi_nyc_taxi_trip_analysis.lvdash.json"
          python3 -m json.tool "$FILE" > /dev/null && echo "✅ JSON válido" || exit 1

      - name: Validate bundle config
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target dev && echo "✅ Bundle válido"

  # ─── Deploy automático no PR (após validate) ─────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Este dashboard usa samples.nyctaxi — catálogo built-in sem prefixo de ambiente.
          # Nenhuma substituição de catálogo necessária.
          databricks bundle deploy --target dev --auto-approve
          echo "✅ Deploy DEV concluído — verifique em: ${{ secrets.DATABRICKS_HOST }}/dashboards"

  # ─── Deploy prod (push na main — aprovação manual via GitHub Environment) ────
  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target prod --auto-approve
          echo "✅ Deploy PROD concluído — verifique em: ${{ secrets.DATABRICKS_HOST }}/dashboards"
