bundle:
  name: "dashboards-test"
  # Teste de pipeline CI/CD — NYC Taxi Trip Analysis

# warehouse_id usa lookup para resolver o ID pelo nome sem criar/gerenciar o warehouse
variables:
  catalog_name:
    default: samples
  schema_name:
    default: nyctaxi
  dashboard_file_path:
    default: ./src/samples_nyctaxi_nyc_taxi_trip_analysis.lvdash.json
  dashboard_name:
    default: "NYC Taxi Trip Analysis"
  warehouse_id:
    lookup:
      warehouse: "Serverless Starter Warehouse"

resources:

  dashboards:
    current_dashboard:
      display_name: ${var.dashboard_name}
      file_path: ${var.dashboard_file_path}
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog_name}
      dataset_schema: ${var.schema_name}
      embed_credentials: false
      permissions:
        - level: CAN_RUN
          group_name: "users"

targets:

  dev:
    mode: development
    default: true

  prod:
    mode: production
